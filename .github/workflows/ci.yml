name: Native simulation and Python contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q
      - run: python tools/rollout.py --ticks 64 --output runs/ci.jsonl
      - run: python tools/rollout.py --replay runs/ci.jsonl
      - name: Audit the full sensory reference journal
        run: |
          python -S -c "import gzip; from pathlib import Path; Path('runs/ci-perception-reference.lwj').open('xb').write(gzip.decompress(Path('examples/perception-42-social.lwj.gz').read_bytes()))"
          python -S tools/journal.py --output runs/ci-perception-reference.lwj --verify-only --audit-compatible
